          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">

            </li>
            <li class="nav-item">
              <a href="#" class="nav-link">Offerte</a>
            </li>
            <li class="nav-item">

          </ul>

    </nav>

  <div id="hero" class="carousel slide" data-bs-ride="carousel">

        <p></p>
      </div>
      <div class="carousel-item"></div>
      <div class="carousel-item"></div>
    </div>
  </div>

  <main class="container my-4">
    <div class="row">
      <aside class="col-lg-3 d-none d-lg-block">
        <div class="bg-light p-3 rounded border">
          <h3 class="fs-5 fw-bold mb-3">Categorie</h3>
          <p class="m-0 mb-2">Scarpe</p>

        </div>
      </aside>

      <section class="col-12 col-lg-9">
        <h2 class="fs-3 fw-bold mb-4 text-center text-md-start">
          Prodotti in evidenza
        </h2>
        <div class="row">
          <article class="col-12 col-sm-6 col-xl-4 mb-3">
            <div class="border rounded p-3 bg-white shadow-sm">

              <div class="bg-secondary mb-2 rounded" style="height: 160px"></div>
              <h3 class="fs-5 fw-bold m-0">Borsa city</h3>
              <p class="text-muted m-0">€ 49,00</p>
            </div>
          </article>
        </div>
      </section>
    </div>
